name: ci

# Scheduled runs execute only on the default branch (main). Work currently
# happens on a different branch, so the weekly run starts only after this file
# reaches main. GitHub also disables scheduled workflows after 60 days without
# repository activity; re-enable them from the Actions tab if that happens.
on:
  push:
  pull_request:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  test:
    # Linux only. go test -race does not build on the maintainer's Windows
    # machine, so this job is the venue for race detection.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The go directive in go.mod is the floor, 1.26.0. The matrix names the
        # latest 1.26 patch release and the latest stable release. The Go
        # version is deliberately not derived from the go directive: that would
        # install exactly go1.26.0, whose standard library has reachable
        # advisories fixed in later patches, and govulncheck would then fail on
        # a clean tree.
        go: ['1.26.x', 'stable']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Vet
        run: go vet ./...
      - name: Test with the race detector
        run: go test -race -count=1 ./...

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      # Default mode on purpose: the one module-level advisory for x/crypto's
      # openpgp (not imported here, no fix exists) must not fail the job.
      #
      # The tool is pinned to an exact version and fetched with the checksum
      # database and public proxy forced on, so a runner-level GOFLAGS, GOPROXY
      # or GONOSUMDB cannot weaken the verification. Dependabot does not track
      # this version (it is not in go.mod); bump it by hand.
      - name: Install govulncheck
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GONOSUMDB: ''
          GONOSUMCHECK: ''
          GOFLAGS: ''
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: govulncheck
        run: govulncheck ./...
